server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Request logs live in the API; never log browser query strings here.
    access_log off;
    # Nginx error entries cannot redact request URIs or Referer headers.
    # Suppress per-request proxy errors; health exposes availability safely.
    error_log /dev/null;
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
